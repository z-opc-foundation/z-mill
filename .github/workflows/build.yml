name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 17 compile + test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout z-util (dependency source)
        uses: actions/checkout@v7
        with:
          repository: z-opc-foundation/z-util
          path: z-util

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Install z-util artifacts (skip tests — z-util 的 CI 负责测试门禁，这里只供依赖)
        # z-util-doc 家族发布受限于 Central（本地 mvn install 口径），CI 上必须现做一份进 runner 的 ~/.m2。
        run: mvn -B -f z-util/pom.xml -DskipTests clean install

      - name: Build (compile + unit test)
        run: mvn -B clean install

      - name: Test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          best = {}
          for x in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              try:
                  r = ET.parse(x).getroot()
              except Exception:
                  continue
              mod = x.split('/target/')[0]
              key = r.get('name')
              if key not in best or len(mod) > len(best[key][0]):
                  best[key] = (mod, r)
          def tot(a):
              return sum(int(r.get(a, 0)) for _, r in best.values())
          print("测试类 %d / 用例 %d / 失败 %d / 错误 %d / 跳过 %d"
                % (len(best), tot('tests'), tot('failures'), tot('errors'), tot('skipped')))
          PY
