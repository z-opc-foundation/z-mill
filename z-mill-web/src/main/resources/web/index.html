<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z-mill 资料磨坊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234f6ef7'/%3E%3Ctext x='16' y='21' font-size='14' text-anchor='middle' fill='white' font-family='monospace'%3E%E7%A3%A8%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f6fa; --panel: #ffffff; --line: #e4e7ef; --ink: #1d2333; --ink2: #6b7280;
  --accent: #4f6ef7; --accent-soft: #eef1ff; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}
header {
  display: flex; align-items: center; gap: 12px; padding: 14px 28px;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
}
header .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
  color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; }
header h1 { font-size: 17px; margin: 0; font-weight: 700; }
header .sub { color: var(--ink2); font-size: 13px; margin-top: 1px; }
header .spacer { flex: 1; }
header .hint { color: var(--ink2); font-size: 13px; }
main { max-width: 1440px; margin: 0 auto; padding: 20px 28px 48px; }

/* 上传区 */
#drop {
  border: 2px dashed #c3cbf5; border-radius: var(--radius); background: var(--panel);
  padding: 44px 24px; text-align: center; cursor: pointer; transition: all .18s ease;
}
#drop:hover { border-color: var(--accent); background: var(--accent-soft); }
#drop.drag { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.004); }
#drop .big { font-size: 17px; font-weight: 600; }
#drop .formats { color: var(--ink2); font-size: 13px; margin-top: 6px; }
#drop .kbd { font-family: var(--mono); background: #f1f3f9; border: 1px solid var(--line);
  border-radius: 5px; padding: 0 6px; font-size: 12px; }
#drop.busy { pointer-events: none; opacity: .6; }
#urlbar { display: flex; gap: 10px; margin-top: 12px; }
#urlbar input {
  flex: 1; font: inherit; font-size: 14px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink);
}
#urlbar input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#urlbar button { padding: 10px 22px; font-size: 14px; white-space: nowrap; }
#drop .spinner { display: inline-block; width: 16px; height: 16px; vertical-align: -3px;
  border: 2px solid #c7d2fe; border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 主体两栏 */
#workspace { display: none; grid-template-columns: 280px 1fr; gap: 18px; margin-top: 18px; align-items: start; }
#workspace.on { display: grid; }
#fileList { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
#fileList .fl-head { padding: 10px 14px; font-size: 13px; color: var(--ink2); border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center; }
#fileList .fl-head a { color: var(--accent); cursor: pointer; }
.fitem { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
.fitem:last-child { border-bottom: none; }
.fitem:hover { background: #f8f9fd; }
.fitem.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.fitem .fname { font-size: 14px; font-weight: 600; word-break: break-all; }
.fitem .fmeta { font-size: 12px; color: var(--ink2); margin-top: 2px; display: flex; gap: 8px; align-items: center; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 20px; letter-spacing: .3px; }
.badge.fmt { background: #eef1ff; color: var(--accent); }
.badge.ok { background: #e8f7ee; color: var(--ok); }
.badge.unsupported { background: #fdf3e3; color: var(--warn); }
.badge.failed { background: #fdeaea; color: var(--bad); }

/* 查看器 */
#viewer { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.vhead { padding: 12px 18px 10px; border-bottom: 1px solid var(--line); }
.vhead .vtitle { font-weight: 700; font-size: 15px; word-break: break-all; }
.vhead .chips { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 12px; color: var(--ink2); background: #f1f3f9; border-radius: 20px; padding: 2px 10px; }

/* 转换目标选择条 */
.targets { display: flex; gap: 8px; flex-wrap: wrap; padding: 11px 18px;
  border-bottom: 1px solid var(--line); background: #fafbfe; }
.target { display: inline-flex; gap: 7px; align-items: center; padding: 7px 15px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer;
  font: inherit; font-size: 13.5px; color: var(--ink); transition: all .12s; }
.target:hover { border-color: var(--accent); color: var(--accent); }
.target.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.target .ic { font-family: var(--mono); font-size: 12px; opacity: .85; }
.targets .tlabel { font-size: 12.5px; color: var(--ink2); align-self: center; margin-right: 2px; }

/* 目标专属工具条 */
.tbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 18px;
  border-bottom: 1px solid var(--line); min-height: 30px; }
.tbar .tmeta { font-size: 12.5px; color: var(--ink2); }
.tbar .gap { flex: 1; }
button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 8px; padding: 5px 13px; cursor: pointer; transition: all .12s; }
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); color: #fff; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 5px 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tbar input[type="text"] {
  font: inherit; font-size: 13px; padding: 6px 12px; width: 240px;
  border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
}
.tbar input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.tbody { padding: 4px 18px 24px; max-height: calc(100vh - 360px); min-height: 280px; overflow: auto; }
.tbody .plain { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; word-break: break-word; }
.tbody .msg { padding: 30px 10px; text-align: center; color: var(--ink2); }

/* 原文阅读视图 */
.read { font-size: var(--fs, 16px); line-height: 1.85; max-width: 820px; margin: 0 auto; }

/* 原文编辑视图 */
.editlist { max-width: 820px; margin: 0 auto; }
.editrow { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
.editrow .etag { flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--accent);
  background: var(--accent-soft); border-radius: 5px; padding: 3px 7px; margin-top: 4px;
  min-width: 22px; text-align: center; }
.editrow .rotag { flex-shrink: 0; font-size: 11px; color: var(--ink2);
  background: #f1f3f9; border-radius: 5px; padding: 3px 7px; margin-top: 4px; }
.eblock { flex: 1; border: 1px dashed transparent; border-radius: 8px; padding: 3px 10px;
  cursor: text; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.eblock:hover { border-color: #c3cbf5; background: #fafbff; }
.eblock:focus { outline: none; border-color: var(--accent); background: #fff;
  box-shadow: 0 0 0 3px var(--accent-soft); }
.eblock.eh { font-weight: 700; font-size: 1.15em; }
.eblock.eq { color: #3b4256; }
.eblock.ecode { font-family: var(--mono); font-size: .82em; background: #f6f7fb; }
.editrow .robody { flex: 1; min-width: 0; }
.editrow .robody table { font-size: .8em; }
.editrow .robody img { max-height: 120px; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }
.editrow .robody .imgmiss { display: inline-block; background: #f1f3f9; border: 1px dashed var(--line);
  border-radius: 6px; padding: 2px 10px; font-size: .75em; color: var(--ink2); }
.edit-hint { max-width: 820px; margin: 4px auto 12px; font-size: 12.5px; color: var(--ink2);
  background: #fffbe8; border: 1px solid #f1e5b6; border-radius: 8px; padding: 7px 14px; }
.read h1, .read h2, .read h3, .read h4, .read h5, .read h6 { margin: 1.15em 0 .5em; line-height: 1.4; }
.read h1 { font-size: 1.5em; border-bottom: 1px solid var(--line); padding-bottom: .25em; }
.read h2 { font-size: 1.3em; }
.read h3 { font-size: 1.15em; }
.read h4 { font-size: 1.03em; }
.read p { margin: .6em 0; white-space: pre-wrap; }
.read blockquote { margin: .8em 0; padding: 8px 16px; border-left: 3px solid #c7d2fe;
  background: var(--accent-soft); border-radius: 0 8px 8px 0; color: #3b4256; white-space: pre-wrap; }
.read pre { background: #f6f7fb; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; }
.read pre code { font-family: var(--mono); font-size: .82em; }
.read .imgwrap { text-align: center; margin: 14px 0; }
.read .imgwrap img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
.read .imgmiss { display: inline-block; background: #f1f3f9; border: 1px dashed var(--line);
  border-radius: 6px; padding: 4px 14px; font-size: .78em; color: var(--ink2); }
.read table { border-collapse: collapse; margin: .8em 0; font-size: .86em; max-width: 100%; display: block; overflow-x: auto; }
.read th, .read td { border: 1px solid var(--line); padding: 5px 11px; vertical-align: top; }
.read th { background: #f4f6fd; font-weight: 600; }
.read td p { margin: 0; white-space: pre-wrap; }
.read .sheetname { margin: 1.2em 0 .3em; font-size: .95em; color: var(--ink2); font-weight: 600; }
.read .slide { border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; margin: 14px 0;
  background: #fcfcff; }
.read .slide .slno { font-size: .72em; color: var(--ink2); letter-spacing: 1px; }

/* markdown 渲染 */
.md { font-size: 14.5px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.1em 0 .45em; line-height: 1.35; }
.md h1 { font-size: 1.45em; border-bottom: 1px solid var(--line); padding-bottom: .2em; }
.md h2 { font-size: 1.25em; }
.md h3 { font-size: 1.1em; }
.md p { margin: .55em 0; }
.md code { font-family: var(--mono); font-size: .88em; background: #f1f3f9; border-radius: 4px; padding: 1px 5px; }
.md pre { background: #f6f7fb; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: .6em 0; padding: 6px 14px; border-left: 3px solid #c7d2fe; background: var(--accent-soft);
  border-radius: 0 8px 8px 0; color: #3b4256; }
.md table { border-collapse: collapse; margin: .7em 0; font-size: 13.5px; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 12px; }
.md th { background: #f4f6fd; font-weight: 600; }
.md a { color: var(--accent); }
.md hr { border: none; border-top: 1px solid var(--line); margin: 1.1em 0; }
.md img.mdimg { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); margin: 4px 0; }

/* 分块 */
.chunk { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; overflow: hidden; }
.chunk .chead { padding: 7px 14px; background: #f8f9fd; border-bottom: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink2); display: flex; gap: 8px; align-items: center; }
.chunk .chead .cno { background: var(--accent-soft); color: var(--accent); font-weight: 700;
  border-radius: 5px; padding: 0 7px; font-size: 11.5px; }
.chunk .ctext { padding: 10px 14px; white-space: pre-wrap; font-size: 13px; word-break: break-word; }
.chunk mark { background: #fff3bf; border-radius: 3px; padding: 0 1px; }

/* 图片墙 */
.imggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding-top: 10px; }
.imgcell { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fafbfe; }
.imgcell img { width: 100%; height: 130px; object-fit: cover; display: block; cursor: zoom-in; }
.imgcell .icap { padding: 5px 10px; font-size: 12px; color: var(--ink2); display: flex;
  justify-content: space-between; align-items: center; gap: 6px; }
.imgcell .icap span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ZIP 卡片 */
.zipcard { border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; max-width: 640px; margin: 16px auto; }
.zipcard h3 { margin: 0 0 8px; }
.zipcard ul { margin: 8px 0 14px; padding-left: 20px; color: var(--ink2); font-size: 13.5px; }
.zipcard li { margin: 3px 0; }

/* 大图灯箱 */
#lightbox { position: fixed; inset: 0; background: rgba(15,18,32,.82); display: none;
  align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
#lightbox.on { display: flex; }
#lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 8px; }

#toast { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
  background: #23293d; color: #fff; border-radius: 10px; padding: 9px 20px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 99; max-width: 80vw; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: var(--bad); }
footer { text-align: center; color: var(--ink2); font-size: 12.5px; margin-top: 34px; }
footer a { color: var(--ink2); }
</style>
</head>
<body>
<header>
  <div class="logo">磨</div>
  <div>
    <h1>z-mill 资料磨坊</h1>
    <div class="sub">拖进来 → 先看原文 → 再挑要磨成什么</div>
  </div>
  <div class="spacer"></div>
  <div class="hint">14 种格式 · 零依赖 · 本机研磨，文件不出你的机器</div>
</header>

<main>
  <div id="drop">
    <div class="big" id="dropText">把资料拖到这里，或点击选择文件</div>
    <div class="formats">pdf · docx · doc · xlsx · xls · pptx · ppt · rtf · odt · ods · odp · epub · txt · html　（可多选，<span class="kbd">Ctrl/⌘+V</span> 粘贴也行）</div>
    <input id="picker" type="file" multiple hidden>
  </div>

  <div id="urlbar">
    <input id="urlInput" type="text" spellcheck="false" placeholder="或粘贴网页地址（http/https），整页抓进来磨">
    <button id="urlGo" class="primary">磨这个网页</button>
  </div>

  <div id="workspace">
    <div id="fileList">
      <div class="fl-head"><span>成品清单</span><a id="reset">清空重来</a></div>
      <div id="files"></div>
    </div>
    <div id="viewer">
      <div class="vhead">
        <div class="vtitle" id="vTitle"></div>
        <div class="chips" id="vChips"></div>
      </div>
      <div class="targets" id="targets"></div>
      <div class="tbar" id="tBar"></div>
      <div class="tbody" id="tBody"></div>
    </div>
  </div>

  <footer>z-mill · 解析引擎来自 z-util-doc 十三件套 · <a href="https://github.com/z-opc-foundation/z-mill" target="_blank" rel="noreferrer">GitHub</a></footer>
</main>
<div id="lightbox"><img alt=""></div>
<div id="toast"></div>

<script>
"use strict";
const VIEWS = null; // 旧 tab 模式已废，改为"转换目标"模式
const TARGETS = [
  { key: "source",  label: "原文",     icon: "📖" },
  { key: "md",      label: "Markdown", icon: "M↓" },
  { key: "json",    label: "JSON",     icon: "{ }" },
  { key: "txt",     label: "纯文本",   icon: "≡" },
  { key: "html",    label: "HTML",     icon: "<>" },
  { key: "chunks",  label: "RAG 分块", icon: "◫" },
  { key: "images",  label: "图片",     icon: "🖼" },
  { key: "zip",     label: "ZIP 打包", icon: "🗜" },
];
const state = {
  results: [], sel: -1, target: "source", srcMode: "read",
  mdMode: "read", htmlMode: "view", chunkQuery: "", fs: 16,
};

const $ = id => document.getElementById(id);
const drop = $("drop"), picker = $("picker");

/* ---------- 上传交互 ---------- */
drop.addEventListener("click", () => picker.click());
picker.addEventListener("change", () => { grindFiles([...picker.files]); picker.value = ""; });
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => grindFiles([...e.dataTransfer.files]));
document.addEventListener("paste", e => {
  const files = [...(e.clipboardData ? e.clipboardData.files : [])];
  if (files.length) grindFiles(files);
});

async function grindFiles(files) {
  if (!files.length) return;
  const fd = new FormData();
  files.forEach(f => fd.append("files", f, f.name));
  fd.append("views", "md,json,txt,html");
  fd.append("chunks", "true");
  state.lastForm = fd;
  await postGrind("/api/grind", fd, files.length + " 个文件", files.map(f => ({ file: f })));
}

async function grindUrl() {
  const url = $("urlInput").value.trim();
  if (!url) { toast("先填一个网页地址", true); return; }
  const btn = $("urlGo");
  btn.disabled = true;
  btn.textContent = "抓取中…";
  try {
    const res = await fetch("/api/grind-url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    acceptResults(data.results, [{ url: url }]);
    const r = data.results[0];
    toast(r && r.status === "ok" ? "网页已磨成成品" : (r && r.status === "unsupported" ? "抓到了，但嗅探不出格式" : "研磨失败：" + (r && r.error || "未知")));
  } catch (e) {
    toast("抓取失败：" + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = "磨这个网页";
  }
}
$("urlGo").addEventListener("click", grindUrl);
$("urlInput").addEventListener("keydown", e => { if (e.key === "Enter") grindUrl(); });

async function postGrind(ep, body, what, metas) {
  drop.classList.add("busy");
  $("dropText").innerHTML = '<span class="spinner"></span>研磨中，' + what + "…";
  try {
    const res = await fetch(ep, { method: "POST", body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    acceptResults(data.results, metas);
    const okN = data.results.filter(r => r.status === "ok").length;
    toast("磨完 " + okN + "/" + data.results.length + " 件");
  } catch (e) {
    toast("研磨失败：" + e.message, true);
  } finally {
    drop.classList.remove("busy");
    $("dropText").textContent = "把资料拖到这里，或点击选择文件";
  }
}

function acceptResults(results, metas) {
  state.results = state.results.concat(results);
  const firstOk = results.findIndex(r => r.status === "ok");
  state.sel = state.results.length - results.length + (firstOk >= 0 ? firstOk : 0);
  state.target = "source";
  state.chunkQuery = "";
  results.forEach((r, i) => {
    const m = metas && metas[i];
    if (m) { r.file = m.file || null; r.url = m.url || null; }
    r.edits = {};
  });
  renderList(); renderViewer();
}

$("reset").addEventListener("click", () => {
  state.results = []; state.sel = -1;
  $("workspace").classList.remove("on");
});

/* ---------- 清单 ---------- */
function renderList() {
  $("workspace").classList.add("on");
  const box = $("files");
  box.innerHTML = "";
  state.results.forEach((r, i) => {
    const div = document.createElement("div");
    div.className = "fitem" + (i === state.sel ? " sel" : "");
    const name = document.createElement("div");
    name.className = "fname";
    name.textContent = r.name;
    const meta = document.createElement("div");
    meta.className = "fmeta";
    const badge = document.createElement("span");
    badge.className = "badge " + r.status;
    badge.textContent = r.status === "ok" ? (r.format || "") : (r.status === "unsupported" ? "不支持" : "失败");
    meta.appendChild(badge);
    if (r.status === "ok") {
      const m = document.createElement("span");
      m.textContent = r.stats.chars + " 字 · " + r.stats.blocks + " 块" + (r.chunks ? " · " + r.chunks.length + " 分块" : "");
      meta.appendChild(m);
    } else {
      const m = document.createElement("span");
      m.textContent = r.error || "嗅探不出已知格式";
      meta.appendChild(m);
    }
    div.appendChild(name); div.appendChild(meta);
    div.addEventListener("click", () => { state.sel = i; state.target = "source"; renderList(); renderViewer(); });
    box.appendChild(div);
  });
}

/* ---------- 公共小件 ---------- */
function mkButton(label, fn, primary) {
  const b = document.createElement("button");
  if (primary) b.className = "primary";
  b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}
function mkSeg(options, cur, cb) {
  const seg = document.createElement("span");
  seg.className = "seg";
  options.forEach(o => {
    const b = document.createElement("button");
    b.textContent = o.label;
    if (o.key === cur) b.classList.add("on");
    b.addEventListener("click", () => cb(o.key));
    seg.appendChild(b);
  });
  return seg;
}
function downloadBlob(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
  toast("已下载 " + name);
}
function downloadText(name, text) {
  downloadBlob(name, new Blob([text], { type: "text/plain;charset=utf-8" }));
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("已复制 " + text.length + " 字符"); }
  catch (e) { toast("复制失败", true); }
}
function baseName(r) { return r.name.replace(/\.[^.]*$/, "") || r.name; }
function docJson(r) {
  try { return JSON.parse(r.outputs.json); } catch (e) { return null; }
}
function imgByName(r) {
  const map = {};
  (r.images || []).forEach(im => { if (im.name && !map[im.name]) map[im.name] = im; });
  return map;
}
function openLightbox(src) {
  const lb = $("lightbox");
  lb.querySelector("img").src = src;
  lb.classList.add("on");
}
$("lightbox").addEventListener("click", () => $("lightbox").classList.remove("on"));
/* ---------- 查看器：目标选择条 ---------- */
function availableTargets(r) {
  return TARGETS.filter(t => {
    if (t.key === "source") return true;
    if (t.key === "chunks") return r.chunks && r.chunks.length;
    if (t.key === "images") return r.images && r.images.length;
    if (t.key === "zip") return !!state.lastForm;
    return !!r.outputs[t.key];
  });
}

function renderViewer() {
  const r = state.results[state.sel];
  const targetsBox = $("targets"), bar = $("tBar"), body = $("tBody");
  $("vTitle").textContent = r ? r.name : "";
  $("vChips").innerHTML = "";
  targetsBox.innerHTML = ""; bar.innerHTML = ""; body.innerHTML = "";
  if (!r) return;
  if (r.status !== "ok") {
    body.innerHTML = '<div class="msg">' + (r.status === "unsupported"
        ? "这个文件嗅探不出已知格式。<br>支持：pdf · docx · doc · xlsx · xls · pptx · ppt · rtf · odt · ods · odp · epub · txt · html"
        : "研磨失败：" + esc(r.error || "未知错误")) + "</div>";
    return;
  }
  const chips = [r.format, r.stats.chars + " 字", r.stats.blocks + " 块"];
  if (r.chunks) chips.push(r.chunks.length + " 分块");
  if (r.images && r.images.length) chips.push(r.images.length + " 图");
  const dj = docJson(r);
  if (dj && dj.meta && dj.meta.pageCount) chips.push(dj.meta.pageCount + " 页");
  chips.forEach(c => { const s = document.createElement("span"); s.className = "chip"; s.textContent = c; $("vChips").appendChild(s); });

  const avail = availableTargets(r);
  if (!avail.find(t => t.key === state.target)) state.target = "source";
  const lab = document.createElement("span");
  lab.className = "tlabel";
  lab.textContent = "磨成 ↓";
  targetsBox.appendChild(lab);
  avail.forEach(t => {
    const b = document.createElement("button");
    b.className = "target" + (state.target === t.key ? " on" : "");
    const ic = document.createElement("span");
    ic.className = "ic"; ic.textContent = t.icon;
    b.appendChild(ic); b.appendChild(document.createTextNode(t.label));
    b.addEventListener("click", () => { state.target = t.key; renderViewer(); });
    targetsBox.appendChild(b);
  });
  RENDER[state.target](r, bar, body);
}

const EDITABLE = { paragraph: "段", heading: "题", "list-item": "列", quote: "引", code: "码" };

function appendBlocksEdit(root, blocks, imgs, r) {
  blocks.forEach((b, i) => {
    if (EDITABLE[b.type]) {
      const badge = b.type === "heading" ? "H" + Math.min(6, Math.max(1, b.level || 1))
          : b.type === "list-item" ? (b.ordered ? "1." : "•")
          : EDITABLE[b.type];
      const text = b.type === "code" ? (b.text || "") : spanText(b.spans);
      root.appendChild(editRow(r, i, badge, text, b.type));
      return;
    }
    const row = document.createElement("div");
    row.className = "editrow";
    const tag = document.createElement("span");
    tag.className = "rotag";
    tag.textContent = b.type === "table" ? "表格" : b.type === "sheet" ? "工作表"
        : b.type === "image" ? "图片" : "幻灯片";
    tag.title = "此类型暂不支持编辑";
    const ro = document.createElement("div");
    ro.className = "robody";
    if (b.type === "table") {
      ro.appendChild(buildTable(b, imgs));
    } else if (b.type === "sheet") {
      ro.appendChild(buildSheet(b));
    } else if (b.type === "image") {
      const im = imgs[b.name];
      if (im) {
        const img = document.createElement("img");
        img.src = "data:" + (im.mime || "image/png") + ";base64," + im.b64;
        img.addEventListener("click", () => openLightbox(img.src));
        ro.appendChild(img);
      } else {
        const miss = document.createElement("span");
        miss.className = "imgmiss";
        miss.textContent = "🖼 " + b.name;
        ro.appendChild(miss);
      }
    } else if (b.type === "slides") {
      (b.slides || []).forEach(sl => {
        const sec = document.createElement("div");
        sec.className = "slide";
        const no = document.createElement("div");
        no.className = "slno"; no.textContent = "SLIDE " + sl.index;
        sec.appendChild(no);
        appendBlocks(sec, sl.blocks || [], imgs);
        ro.appendChild(sec);
      });
    }
    row.appendChild(tag); row.appendChild(ro);
    root.appendChild(row);
  });
}

function editRow(r, i, badge, text, type) {
  const row = document.createElement("div");
  row.className = "editrow";
  const tag = document.createElement("span");
  tag.className = "etag";
  tag.textContent = badge;
  const ed = document.createElement("div");
  ed.className = "eblock" + (type === "heading" ? " eh" : type === "quote" ? " eq"
      : type === "code" ? " ecode" : "");
  ed.contentEditable = "true";
  ed.spellcheck = false;
  ed.textContent = text;
  ed.addEventListener("blur", () => {
    const t = ed.innerText.replace(/\n+$/, "");
    if (!r.edits) r.edits = {};
    if (t === text) { delete r.edits[i]; }
    else { r.edits[i] = t; }
    updateDirty(r);
  });
  row.appendChild(tag); row.appendChild(ed);
  return row;
}

function updateDirty(r) {
  const d = $("dirtyMeta");
  if (d) d.textContent = "改了 " + Object.keys(r.edits || {}).length + " 处";
}

async function ensureSession(r) {
  if (r.sessionId) return;
  let res;
  if (r.file) {
    const fd = new FormData();
    fd.append("file", r.file, r.name);
    res = await fetch("/api/edit-open", { method: "POST", body: fd });
  } else if (r.url) {
    res = await fetch("/api/edit-open", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: r.url }),
    });
  } else {
    throw new Error("原始文件不在手上（刷新过页面就没了），重新拖一次即可编辑");
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  r.sessionId = data.sessionId;
}

async function saveEdits(r, btn, retried) {
  const fmt = ($("fmtSel") || {}).value || "md";
  try {
    if (btn) { btn.disabled = true; btn.textContent = "保存中…"; }
    await ensureSession(r);
    const edits = Object.entries(r.edits || {}).map(([i, text]) => ({ i: Number(i), text: text }));
    const res = await fetch("/api/edit-export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: r.sessionId, fmt: fmt, edits: edits }),
    });
    if (res.status === 404 && !retried) {
      r.sessionId = null;
      await saveEdits(r, btn, true);
      return;
    }
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error || res.status);
    }
    const blob = await res.blob();
    downloadBlob(baseName(r) + "." + fmt, blob);
  } catch (e) {
    toast("保存失败：" + e.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "保存并下载"; }
  }
}

function spanText(spans) {
  return (spans || []).map(s => s.text || "").join("");
}

function appendBlocks(root, blocks, imgs) {
  let listEl = null, listOrdered = false, listLevel = -1;
  const closeList = () => { listEl = null; listLevel = -1; };
  blocks.forEach(b => {
    if (b.type === "list-item") {
      if (!listEl || b.level < listLevel || (b.level === listLevel && b.ordered !== listOrdered)) {
        listEl = document.createElement(b.ordered ? "ol" : "ul");
        listOrdered = b.ordered; root.appendChild(listEl);
      }
      const li = document.createElement("li");
      li.textContent = spanText(b.spans);
      li.style.whiteSpace = "pre-wrap";
      listEl.appendChild(li);
      listLevel = b.level;
      if (b.level > listLevel) { /* 嵌套暂平铺 */ }
      return;
    }
    closeList();
    if (b.type === "paragraph") {
      const p = document.createElement("p");
      p.textContent = spanText(b.spans);
      root.appendChild(p);
    } else if (b.type === "heading") {
      const h = document.createElement("h" + Math.min(6, Math.max(1, b.level || 1)));
      h.textContent = spanText(b.spans);
      root.appendChild(h);
    } else if (b.type === "quote") {
      const q = document.createElement("blockquote");
      q.textContent = spanText(b.spans);
      root.appendChild(q);
    } else if (b.type === "code") {
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.textContent = b.text || "";
      pre.appendChild(code);
      root.appendChild(pre);
    } else if (b.type === "image") {
      const wrap = document.createElement("div");
      wrap.className = "imgwrap";
      const im = imgs[b.name];
      if (im) {
        const img = document.createElement("img");
        img.src = "data:" + (im.mime || "image/png") + ";base64," + im.b64;
        img.alt = b.name;
        img.addEventListener("click", () => openLightbox(img.src));
        wrap.appendChild(img);
      } else {
        const miss = document.createElement("span");
        miss.className = "imgmiss";
        miss.textContent = "🖼 " + b.name;
        wrap.appendChild(miss);
      }
      root.appendChild(wrap);
    } else if (b.type === "table") {
      root.appendChild(buildTable(b, imgs));
    } else if (b.type === "sheet") {
      const name = document.createElement("div");
      name.className = "sheetname";
      name.textContent = "📄 " + (b.name || "工作表");
      root.appendChild(name);
      root.appendChild(buildSheet(b));
    } else if (b.type === "slides") {
      (b.slides || []).forEach(sl => {
        const sec = document.createElement("div");
        sec.className = "slide";
        const no = document.createElement("div");
        no.className = "slno";
        no.textContent = "SLIDE " + sl.index;
        sec.appendChild(no);
        if (sl.title) {
          const t = document.createElement("h3");
          t.textContent = sl.title;
          sec.appendChild(t);
        }
        appendBlocks(sec, sl.blocks || [], imgs);
        root.appendChild(sec);
      });
    }
  });
}

function buildTable(t, imgs) {
  const table = document.createElement("table");
  (t.rows || []).forEach(row => {
    const tr = document.createElement("tr");
    (row.cells || []).forEach(cell => {
      const td = document.createElement(row.header ? "th" : "td");
      if (cell.colspan > 1) td.colSpan = cell.colspan;
      if (cell.rowspan > 1) td.rowSpan = cell.rowspan;
      const cb = cell.blocks == null ? [] : (Array.isArray(cell.blocks) ? cell.blocks : [cell.blocks]);
      appendBlocks(td, cb, imgs);
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  return table;
}

function buildSheet(s) {
  const table = document.createElement("table");
  let maxCol = 0;
  (s.rows || []).forEach(r => r.cells.forEach(c => { maxCol = Math.max(maxCol, c.column + (c.colspan || 1)); }));
  const letter = i => String.fromCharCode(65 + (i % 26)) + (i >= 26 ? String.fromCharCode(65 + Math.floor(i / 26) - 1) : "");
  const head = document.createElement("tr");
  const corner = document.createElement("th");
  corner.textContent = "#";
  head.appendChild(corner);
  for (let i = 0; i < maxCol; i++) {
    const th = document.createElement("th");
    th.textContent = letter(i);
    head.appendChild(th);
  }
  table.appendChild(head);
  (s.rows || []).forEach(row => {
    const tr = document.createElement("tr");
    const no = document.createElement("td");
    no.textContent = row.index;
    no.style.color = "#9aa1b2";
    tr.appendChild(no);
    const byCol = {};
    row.cells.forEach(c => { byCol[c.column] = c; });
    for (let i = 0; i < maxCol; i++) {
      const td = document.createElement("td");
      const c = byCol[i];
      if (c) {
        td.textContent = c.text || "";
        if (c.type === "FORMULA") td.style.fontStyle = "italic";
        if (c.type === "NUMBER") td.style.textAlign = "right";
        if (c.colspan > 1) td.colSpan = c.colspan;
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  });
  return table;
}

/* ---------- 目标 6：RAG 分块 ---------- */
function renderChunks(r, bar, body) {
  const search = document.createElement("input");
  search.type = "text";
  search.placeholder = "在分块里搜…";
  search.value = state.chunkQuery;
  search.addEventListener("input", () => { state.chunkQuery = search.value; renderChunkCards(r, body, search); });
  bar.appendChild(search);
  const meta = document.createElement("span");
  meta.className = "tmeta";
  meta.id = "chunkMeta";
  bar.appendChild(meta);
  bar.appendChild(document.createElement("span")).className = "gap";
  const jsonl = r.chunks.map(c => JSON.stringify(c)).join("\n");
  bar.appendChild(mkButton("下载 .chunks.jsonl", () => downloadText(baseName(r) + ".chunks.jsonl", jsonl)));
  renderChunkCards(r, body, search);
  search.focus();
}

function renderChunkCards(r, body, search) {
  const q = state.chunkQuery.trim().toLowerCase();
  const meta = $("chunkMeta");
  body.innerHTML = "";
  const list = q ? r.chunks.filter(c =>
      (c.text || "").toLowerCase().includes(q)
      || (c.path || []).join("/").toLowerCase().includes(q)) : r.chunks;
  if (meta) meta.textContent = "共 " + r.chunks.length + " 块" + (q ? " · 命中 " + list.length : "");
  if (!list.length) { body.innerHTML = '<div class="msg">没有命中的分块</div>'; return; }
  const frag = document.createDocumentFragment();
  const idxOf = c => r.chunks.indexOf(c);
  list.forEach(c => {
    const card = document.createElement("div"); card.className = "chunk";
    const head = document.createElement("div"); head.className = "chead";
    const no = document.createElement("span"); no.className = "cno"; no.textContent = "#" + (idxOf(c) + 1);
    const crumb = document.createElement("span");
    crumb.textContent = (c.path || []).filter(p => p).join(" / ") || "(无标题)";
    head.appendChild(no); head.appendChild(crumb);
    const text = document.createElement("div"); text.className = "ctext";
    if (q) {
      const t = c.text || "";
      const low = t.toLowerCase();
      let pos = low.indexOf(q), out = "", cursor = 0, hits = 0;
      while (pos >= 0 && hits < 50) {
        out += esc(t.slice(cursor, pos)) + "<mark>" + esc(t.slice(pos, pos + q.length)) + "</mark>";
        cursor = pos + q.length; hits++;
        pos = low.indexOf(q, cursor);
      }
      out += esc(t.slice(cursor));
      text.innerHTML = out;
    } else {
      text.textContent = c.text || "";
    }
    card.appendChild(head); card.appendChild(text); frag.appendChild(card);
  });
  body.appendChild(frag);
}

function renderImages(r, bar, body) {

  meta.className = "tmeta";

  bar.appendChild(meta);

    const img = document.createElement("img");
    img.src = src; img.loading = "lazy"; img.alt = im.name || "图片";
    img.addEventListener("click", () => openLightbox(src));
    const cap = document.createElement("div");
    cap.className = "icap";
    const nm = document.createElement("span");
    nm.textContent = im.name || "图片 " + (i + 1);
    const dl = mkButton("↓", () => {
      const blob = new Blob([Uint8Array.from(atob(im.b64), c => c.charCodeAt(0))],
          { type: im.mime || "image/png" });
      downloadBlob(im.name || "image-" + (i + 1) + guessExt(im.mime), blob);
    });
    cap.appendChild(nm); cap.appendChild(dl);
    cell.appendChild(img); cell.appendChild(cap);
    grid.appendChild(cell);
  });
  body.appendChild(grid);
}

function guessExt(mime) {
  const m = { "image/jpeg": ".jpg", "image/png": ".png", "image/gif": ".gif",
      "image/webp": ".webp", "image/bmp": ".bmp" };
  return m[mime] || ".png";
}

/* ---------- 目标 8：ZIP ---------- */
function renderZip(r, bar, body) {
  const card = document.createElement("div");
  card.className = "zipcard";
  const h = document.createElement("h3");
  h.textContent = "ZIP 全家桶";
  card.appendChild(h);
  const ul = document.createElement("ul");
  [[r.name, "原样保留的源文件"],
   [baseName(r) + ".md / .json / .txt / .html", "四种成品格式"],
   ["images/", "内嵌图片逐张落盘"],
   ["manifest.txt", "批次清单"]].forEach(x => {
    const li = document.createElement("li");
    li.innerHTML = "<b>" + esc(x[0]) + "</b>　" + esc(x[1]);
    ul.appendChild(li);
  });
  card.appendChild(ul);
  const btn = mkButton("🗜 打包下载 .zip", async () => {
    btn.disabled = true; btn.textContent = "打包中…";
    try {
      const res = await fetch("/api/grind-zip", { method: "POST", body: state.lastForm });
      if (!res.ok) throw new Error(res.status);
      downloadBlob("z-mill-output.zip", await res.blob());
    } catch (e) {
      toast("打包失败：" + e.message, true);
    } finally {
      btn.disabled = false; btn.textContent = "🗜 打包下载 .zip";
    }
  }, true);
  card.appendChild(btn);
  body.appendChild(card);
}

/* ---------- 安全 markdown 渲染（先转义，再转换） ---------- */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function inline(s) {
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, (m, c) => "<code>" + c + "</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, (m, t) => "<strong>" + t + "</strong>");
  out = out.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, (m, p, t) => p + "<em>" + t + "</em>");
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|#[^)\s]*)\)/g,
    (m, t, u) => '<a href="' + u + '" target="_blank" rel="noreferrer">' + t + "</a>");
  out = out.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, (m, alt, u) => {
    const imgs = window.__imgs || [];
    let hit = imgs.find(im => im.name === alt);
    if (!hit && imgs.__cursor === undefined) imgs.__cursor = 0;
    if (!hit && imgs.__cursor < imgs.length) hit = imgs[imgs.__cursor++];
    if (hit) return '<img class="mdimg" src="data:' + (hit.mime || "image/png")
        + ';base64,' + hit.b64 + '" alt="' + esc(alt || "图片") + '">';
    return '<span class="imgchip">🖼 ' + (alt || "图片") + "</span>";
  });
  out = out.replace(/\\([\\`*_{}\[\]()#+\-.!>|~])/g, "$1");
  return out;
}
function renderMd_(src) {
  const lines = src.split("\n");
  const out = [];
  let para = [], list = null, quote = [], table = [], code = null, listGap = false;
  const flushPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push("</" + list + ">"); list = null; } listGap = false; };
  const flushQuote = () => { if (quote.length) { out.push("<blockquote>" + quote.map(inline).join("<br>") + "</blockquote>"); quote = []; } };
  const flushTable = () => {
    if (!table.length) return;
    let rows = table.filter(r => !/^\|[\s:|-]+\|$/.test(r.trim()));
    if (rows.length) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      let html = "<table>";
      rows.forEach((r, i) => {
        html += "<tr>" + cells(r).map((c, j) => i === 0 ? "<th>" + c + "</th>" : "<td>" + c + "</td>").join("") + "</tr>";
      });
      out.push(html + "</table>");
    }
    table = [];
  };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); flushTable(); };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    if (code !== null) {
      if (/^```/.test(line)) { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; }
      else code.push(raw);
      continue;
    }
    if (/^```/.test(line)) { flushAll(); code = []; continue; }
    if (!line.trim()) { if (list) listGap = true; else flushAll(); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) { flushAll(); out.push("<hr>"); continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushAll(); out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); continue; }
    const q = line.match(/^>\s?(.*)$/);
    if (q) { flushPara(); flushList(); flushTable(); quote.push(q[1]); continue; }
    if (/^\s*\|.*\|/.test(line)) { flushPara(); flushList(); flushQuote(); table.push(line); continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.、]\s+(.*)$/);
    if (ul || ol) {
      flushPara(); flushQuote(); flushTable();
      const want = ul ? "ul" : "ol";
      if (list !== want) { flushList(); out.push("<" + want + ">"); list = want; }
      listGap = false;
      out.push("<li>" + inline((ul || ol)[1]) + "</li>");
      continue;
    }
    flushAll();
    para.push(line);
  }
  if (code !== null) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
  flushAll();
  return out.join("\n");
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "on" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, 2600);
}

/* 键盘：↑↓ 切文件（编辑态不抢） */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (e.key === "ArrowDown" && state.sel < state.results.length - 1) { state.sel++; renderList(); renderViewer(); e.preventDefault(); }
  if (e.key === "ArrowUp" && state.sel > 0) { state.sel--; renderList(); renderViewer(); e.preventDefault(); }
});
